<div class="action-button-container">
  <!-- Backdrop para cerrar al hacer clic fuera -->
  @if (isOpen()) {
    <div class="backdrop" (click)="close()" role="presentation" tabindex="-1" (keydown.escape)="close()"></div>
  }

  <!-- Botón principal -->
  <button
    class="main-button"
    (click)="toggle()"
    [class.active]="isOpen()"
    type="button"
    aria-label="Menú de acciones"
    [attr.aria-expanded]="isOpen()">
    <svg class="icon" [class.rotated]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16M4 12h16" />
    </svg>
  </button>

  <!-- Opciones del speed dial -->
  <div class="actions-menu" [class.open]="isOpen()">
    @for (action of actions(); track action.id) {
      <button
        class="action-item"
        [class]="'action-item action-' + (action.color || 'primary')"
        (click)="executeAction(action.id)"
        type="button"
        [attr.aria-label]="action.label">
        @if (action.id === 'view') {
          <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        }
        <span class="action-tooltip">{{ action.label }}</span>
      </button>
    }
  </div>
</div>
