<div class="action-button-container">
  <!-- Backdrop para cerrar al hacer clic fuera -->
  @if (isOpen()) {
    <div class="backdrop" (click)="close()" role="presentation" tabindex="-1" (keydown.escape)="close()"></div>
  }

  <!-- Botón principal -->
  <button
    class="main-button"
    (click)="toggle()"
    [class.active]="isOpen()"
    type="button"
    aria-label="Menú de acciones"
    [attr.aria-expanded]="isOpen()">
    <svg class="icon" [class.rotated]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Opciones del speed dial -->
  <div class="actions-menu" [class.open]="isOpen()">
    @for (action of actions(); track action.id) {
      <button
        class="action-item"
        [class]="'action-item action-' + (action.color || 'primary')"
        (click)="executeAction(action.id)"
        type="button"
        [attr.aria-label]="action.label">
        @if (action.id === 'view') {
          <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        } @else if (action.id === 'edit') {
          <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        } @else if (action.id === 'delete') {
          <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        }
        <span class="action-tooltip">{{ action.label }}</span>
      </button>
    }
  </div>
</div>
