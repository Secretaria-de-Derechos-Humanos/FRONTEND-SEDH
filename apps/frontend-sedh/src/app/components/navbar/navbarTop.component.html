<header class="navbar">
  <div class="navbar__brand">
    <img src="/LogoOficialGobierno.png" alt="Logo SEDH" class="navbar__logo">
    <div class="navbar__brand-info">
      <h1 class="navbar__brand-text">Secretaría de Estado de Derechos Humanos</h1>
      <p class="navbar__brand-subtitle">Sistema Electrónico de Datos</p>
    </div>
  </div>

  <div class="navbar__actions">
    <sedh-theme-toggle/>

    <div class="navbar__user-menu">
      <button
        class="navbar__user-avatar"
        type="button"
        (click)="menu.toggle($event)"
        [title]="authService.currentUser()?.nombre + ' ' + authService.currentUser()?.apellido || 'Usuario'">
        <span class="navbar__user-initials">{{ userInitials() }}</span>
      </button>
      <p-menu #menu [model]="userMenuItems" [popup]="true" styleClass="navbar__user-dropdown" />
    </div>
  </div>
</header>
