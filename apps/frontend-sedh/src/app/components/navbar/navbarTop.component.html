<header class="navbar">
  <div class="navbar__brand">
    <img src="/LogoOficialGobierno.png" alt="Logo SEDH" class="navbar__logo">
    <div class="navbar__brand-info">
      <h1 class="navbar__brand-text">Secretaría de Estado de Derechos Humanos</h1>
      <p class="navbar__brand-subtitle">Sistema Electrónico de Datos</p>
    </div>
  </div>

  <div class="navbar__actions">
    <app-theme-toggle/>

    <div class="navbar__user-menu">
      <button
        class="navbar__user-avatar"
        type="button"
        (click)="toggleMenu()">
        <span class="navbar__user-initials">{{ userInitials() }}</span>
      </button>

      @if (isMenuOpen()) {
        <div
          class="navbar__dropdown-overlay"
          (click)="closeMenu()"
          (keydown.escape)="closeMenu()"
          tabindex="0"
          role="button"
          aria-label="Cerrar menú"></div>
        <div class="navbar__dropdown">
          <button
            class="navbar__dropdown-item"
            (click)="navigateTo('/perfil-usuario')">
            <svg class="navbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="navbar__dropdown-text">Ver perfil</span>
          </button>

          <button
            class="navbar__dropdown-item"
            (click)="navigateTo('/perfil-usuario', 'seguridad')">
            <svg class="navbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span class="navbar__dropdown-text">Seguridad</span>
          </button>

          <div class="navbar__dropdown-separator"></div>

          <button
            class="navbar__dropdown-item navbar__dropdown-item--logout"
            (click)="onLogout()">
            <svg class="navbar__dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="navbar__dropdown-text">Cerrar sesión</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
