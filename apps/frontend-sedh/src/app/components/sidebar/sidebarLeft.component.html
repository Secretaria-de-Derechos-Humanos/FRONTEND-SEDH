<aside class="sidebar">

  <!-- Navegación -->
  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [title]="item.label">
        @if (item.icon === 'home') {
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        } @else if (item.icon === 'pending') {
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        }
      </a>
    }
  </nav>

  <!-- Footer: versión -->
  <div class="sidebar__footer">
    <div class="sidebar__version" [title]="'Versión ' + version">
      <span class="sidebar__version-number">v{{ version }}</span>
    </div>
  </div>

</aside>
