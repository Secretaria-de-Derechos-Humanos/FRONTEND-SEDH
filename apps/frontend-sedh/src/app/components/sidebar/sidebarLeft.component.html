<aside class="sidebar">

  <!-- Navegación -->
  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [title]="item.label">
        @if (item.icon === 'home') {
          <i class="pi pi-home nav-item__icon"></i>
        } @else if (item.icon === 'pending') {
          <i class="pi pi-clock nav-item__icon"></i>
        }
      </a>
    }
  </nav>

  <!-- Footer: versión -->
  <div class="sidebar__footer">
    <div class="sidebar__version" title="Versión 0.0.1">
      <span class="sidebar__version-number">v0.0.1</span>
    </div>
  </div>

</aside>
