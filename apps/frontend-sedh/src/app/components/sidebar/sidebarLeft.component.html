<aside class="sidebar">

  <!-- Navegación -->
  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        class="nav-item"
        [title]="item.label">
        <svg class="nav-item__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          @if (item.icon === 'home') {
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          } @else if (item.icon === 'pending') {
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <circle cx="8" cy="16" r="1"/>
            <circle cx="12" cy="16" r="1"/>
            <circle cx="16" cy="16" r="1"/>
          }
        </svg>
      </a>
    }
  </nav>

  <!-- Footer: versión -->
  <div class="sidebar__footer">
    <div class="sidebar__version" title="Versión 0.0.1">
      <span class="sidebar__version-number">v0.0.1</span>
    </div>
  </div>

</aside>
