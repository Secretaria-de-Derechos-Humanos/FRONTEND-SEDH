<aside class="sidebar-left">

  <nav class="sidebar-nav">

    @for (
      item of navItems();
      track item.route
    ) {

      <button
        type="button"
        class="nav-item"

        [class.active]="
          isActiveRoute(item.route)
        "

        [title]="item.label"

        [attr.aria-label]="
          item.label
        "

        (click)="
          onNavigate(item.route)
        "
      >

        <span class="nav-icon">

          @switch (item.icon) {

            <!-- ================================================= -->
            <!-- INICIO -->
            <!-- ================================================= -->

            @case ('home') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  d="M3 10.5L12 3L21 10.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M5 9.5V21H19V9.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M9 21V13H15V21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- PENDIENTES -->
            <!-- ================================================= -->

            @case ('pending') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <circle
                  cx="12"
                  cy="12"
                  r="9"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M12 7V12L16 14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- APROBACIONES -->
            <!-- ================================================= -->

            @case ('approval') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  d="M20 12V19C20 20.1046 19.1046 21 18 21H5C3.89543 21 3 20.1046 3 19V6C3 4.89543 3.89543 4 5 4H15"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M9 11L12 14L21 5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- SEGURIDAD / CONTROL DE SALIDAS -->
            <!-- ================================================= -->

            @case ('security') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  d="M12 3L20 6V11C20 16 16.6 20.5 12 22C7.4 20.5 4 16 4 11V6L12 3Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M12 8V12L15 14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- USUARIO -->
            <!-- ================================================= -->

            @case ('user') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <circle
                  cx="12"
                  cy="7"
                  r="4"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M5 21C5 17.134 8.134 14 12 14C15.866 14 19 17.134 19 21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- VACACIONES -->
            <!-- ================================================= -->

            @case ('vacation') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <path
                  d="M6 3V21"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

                <path
                  d="M6 4H19L16 8L19 12H6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            }


            <!-- ================================================= -->
            <!-- GESTIÓN DE CARGOS -->
            <!-- ================================================= -->

            @case ('briefcase') {

              <svg
                viewBox="0 0 24 24"
                fill="none"
              >

                <rect
                  x="3"
                  y="7"
                  width="18"
                  height="13"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

                <path
                  d="M3 12H21"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M10 12V14H14V12"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

              </svg>

            }

          }

        </span>


        <!-- =================================================== -->
        <!-- TOOLTIP -->
        <!-- =================================================== -->

        <span class="nav-tooltip">
          {{ item.label }}
        </span>

      </button>

    }

  </nav>


  <!-- ===================================================== -->
  <!-- VERSION -->
  <!-- ===================================================== -->

  <div class="sidebar-version">
    v{{ version }}
  </div>

</aside>
