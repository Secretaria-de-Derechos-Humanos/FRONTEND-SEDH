<div class="dashboard">

  <div class="dashboard__header">
    <h1 class="dashboard__title">Dashboard</h1>
    <p class="dashboard__subtitle">Bienvenido al Sistema SEDH — Panel de Control</p>
  </div>

  <div class="dashboard__grid">

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--primary">
        <i class="pi pi-users"></i>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__label">Recursos Humanos</span>
        <span class="stat-card__value">—</span>
        <span class="stat-card__sub">Pendiente de datos</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--secondary">
        <i class="pi pi-chart-bar"></i>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__label">Reportes</span>
        <span class="stat-card__value">—</span>
        <span class="stat-card__sub">Pendiente de datos</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--info">
        <i class="pi pi-file"></i>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__label">Documentos</span>
        <span class="stat-card__value">—</span>
        <span class="stat-card__sub">Pendiente de datos</span>
      </div>
    </div>

  </div>

</div>
