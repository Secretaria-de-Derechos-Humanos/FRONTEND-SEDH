<div class="contenedor-password">
  <div class="card-password">
    <div class="titulo">
      <h2>Cambiar Contraseña</h2>
      <p>
        Está utilizando una contraseña temporal. Debe crear una nueva contraseña
        para continuar.
      </p>
    </div>
    <div class="grupo">
      <label for="passwordActual"> Contraseña Temporal </label>

      <input
        id="passwordActual"
        [type]="mostrarPassword ? 'text':'password'"
        [(ngModel)]="passwordActual"
        class="input"
      />
    </div>
    <div class="grupo">
      <label for="passwordNueva"> Nueva Contraseña </label>

      <input
        id="passwordNueva"
        [type]="mostrarPassword ? 'text':'password'"
        [(ngModel)]="nuevaPassword"
        class="input"
      />
    </div>
    <div class="grupo">
      <label for="confirmarPassword"> Confirmar Contraseña </label>

      <input
        id="confirmarPassword"
        [type]="mostrarPassword ? 'text':'password'"
        [(ngModel)]="confirmarPassword"
        class="input"
      />
    </div>
    <div class="mostrar">
      <input type="checkbox" [(ngModel)]="mostrarPassword" />
      Mostrar contraseñas
    </div>
    <button class="btn-guardar" (click)="guardar()" [disabled]="guardando">
      {{guardando ? 'Guardando...' : 'Guardar Nueva Contraseña'}}
    </button>
  </div>
</div>
