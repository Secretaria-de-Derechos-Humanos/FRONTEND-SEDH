<div class="menu-principal">
  <div class="menu-principal__header">
    <h1 class="menu-principal__title">Menú principal</h1>
    <p class="menu-principal__subtitle">Seleccione el módulo al que desea acceder</p>
  </div>

  <div class="menu-principal__grid">
    @for (option of menuOptions; track option.route) {
      <div
        class="module-item"
        (click)="navigateTo(option.route)"
        (keydown.enter)="navigateTo(option.route)"
        (keydown.space)="navigateTo(option.route)"
        tabindex="0"
        role="button"
        [attr.aria-label]="option.title">
        <div class="module-item__wrapper">
          <img
            class="module-item__image module-item__image--light"
            [src]="option.imageLight"
            [alt]="option.title">
          <img
            class="module-item__image module-item__image--dark"
            [src]="option.imageDark"
            [alt]="option.title">
          <div class="module-item__overlay"></div>
        </div>
      </div>
    }
  </div>
</div>
