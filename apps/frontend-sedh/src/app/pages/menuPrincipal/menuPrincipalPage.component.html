<div class="menu-principal">
  <div class="menu-principal__header">
    <app-encabezados-pagina
      titulo="Menú principal"
      subtitulo="Seleccione el módulo al que desea acceder"
      alineacion="center"
    />
  </div>

  <div class="menu-principal__grid">
    @for (option of menuOptions; track option.route) {
      <app-card
        [title]="option.title"
        [imageUrl]="option.imageLight"
        [altText]="option.description"
        (cardClick)="navigateTo(option.route)"
      />
    }
  </div>
</div>
