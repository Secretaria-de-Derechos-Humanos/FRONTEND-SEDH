<div class="menu-principal">
  <div class="menu-principal__header">
    <app-encabezados-pagina
      titulo="Menú principal"
      subtitulo="Seleccione el módulo al que desea acceder"
      alineacion="center"
    />
  </div>

  <div class="menu-principal__grid">
    @for (option of menuOptions; track option.route) {
      <div
        class="module-item"
        [class.module-item--opening]="option.isOpening"
        (click)="navigateTo(option.route)"
        (keydown.enter)="navigateTo(option.route)"
        (keydown.space)="navigateTo(option.route)"
        tabindex="0"
        role="button"
        [attr.aria-label]="option.title">
        <div class="module-item__card">
          <div class="module-item__svg-container">
            <img
              class="module-item__image"
              [src]="option.imageLight"
              [alt]="option.title">
          </div>
          <!-- Puerta que tapa la imagen -->
          <div class="module-item__door">
            <h2 class="module-item__door-title">{{ option.title }}</h2>
          </div>
        </div>
      </div>
    }
  </div>
</div>
