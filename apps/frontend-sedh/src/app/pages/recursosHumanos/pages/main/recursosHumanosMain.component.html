<div class="rrhh-main-container">
  <app-encabezados-pagina
    titulo="Módulo de Recursos Humanos"
    subtitulo="Gestione todo lo relacionado con recursos humanos."
    alineacion="center"
  />

  <div class="modulos-grid">
    @for (opcion of opcionesDisponibles(); track opcion.route) {
      <app-card
        [title]="opcion.label"
        [imageUrl]="opcion.imageUrl"
        (cardClick)="navegarA(opcion.route)"
      />
    }
  </div>

  @if (opcionesDisponibles().length === 0) {
    <div class="no-permissions">
      <i class="pi pi-lock"></i>
      <p>No tiene permisos asignados para este módulo.</p>
    </div>
  }
</div>
